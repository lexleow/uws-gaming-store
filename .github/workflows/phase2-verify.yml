name: Phase 2 Next.js and OpenNext verification
on:
  push:
    branches: [feature/admin-catalog-options]
  pull_request:
    paths:
      - 'UWS_GAMING_PHASE1/uws-gaming-store/**'
      - '.github/workflows/phase2-verify.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UWS_GAMING_PHASE1/uws-gaming-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:cloudflare
